<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محرر فيديو المنجزات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;700;800&family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Readex+Pro:wght@400;500;600;700&family=Changa:wght@400;600;700&family=El+Messiri:wght@400;600;700&display=swap">
<style>
:root{--bg:#0b1620;--panel:#111f2b;--panel2:#162836;--line:#23394a;--txt:#e6f1f7;--mut:#8aa4b5;--acc:#3FB2DE;--acc2:#0F9FD6;--dan:#e5675b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"IBM Plex Sans Arabic",Tajawal,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:13px;color:var(--txt)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
button.ghost{background:transparent}
button.dan{color:var(--dan)}
input[type=text],input[type=number],select,textarea{background:#0d1a24;border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:60px;line-height:1.6}
input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;background:none;padding:0}
input[type=range]{width:100%}
label{display:block;color:var(--mut);font-size:12px;margin:8px 0 4px}
.app{display:grid;grid-template-columns:270px 1fr 300px;grid-template-rows:52px 1fr 190px;height:100vh}
.top{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font-size:16px;margin:0 0 0 auto;font-weight:700}
.side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px}
.props{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:12px;gap:8px;min-width:0}
.cwrap{position:relative;width:100%;max-width:1200px;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px #0008}
canvas#cv{width:100%;height:100%;display:block;cursor:default}
.ctrl{display:flex;gap:8px;align-items:center;width:100%;max-width:1200px}
.ctrl .time{font-variant-numeric:tabular-nums;color:var(--mut);min-width:110px;text-align:center}
.tl{grid-column:1/4;background:var(--panel);border-top:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.tlbar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.tlscroll{flex:1;overflow-x:auto;overflow-y:hidden;position:relative;direction:ltr}
.tlinner{position:relative;height:100%}
.track{position:absolute;left:0;height:44px;right:0}
.blk{position:absolute;top:4px;height:36px;border-radius:7px;background:#1d3b50;border:1px solid #2c5874;overflow:hidden;white-space:nowrap;font-size:11px;padding:3px 6px;cursor:pointer;direction:rtl;user-select:none}
.blk.sel{outline:2px solid var(--acc)}
.blk .h{position:absolute;top:0;bottom:0;width:7px;background:#3FB2DE55;cursor:ew-resize}
.blk .h.r{right:0}.blk .h.l{left:0}
.blk.aud{background:#3b2a52;border-color:#6b4d93;cursor:grab}
.blk canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#ff5a5a;pointer-events:none;z-index:5}
.ruler{position:absolute;top:0;height:18px;left:0;right:0;font-size:10px;color:var(--mut);cursor:pointer}
.sec{margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:#0f1d28}
.sech{display:flex;align-items:center;gap:6px;padding:7px 8px;border-bottom:1px solid var(--line)}
.sech input{background:transparent;border:none;font-weight:700;padding:2px}
.slist{padding:6px;display:flex;flex-direction:column;gap:5px}
.sitem{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;background:var(--panel2);border:1px solid transparent;cursor:pointer;font-size:12px}
.sitem.sel{border-color:var(--acc)}
.sitem .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sitem .mini{opacity:.7;font-size:11px}
.mini button{padding:2px 6px;font-size:11px}
.addrow{display:flex;flex-wrap:wrap;gap:4px;padding:6px}
.addrow button{font-size:11px;padding:4px 7px}
.grp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:#0f1d28}
.grp h3{margin:0 0 4px;font-size:13px}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1}
.chk{display:flex;align-items:center;gap:6px;margin:6px 0;color:var(--txt);font-size:12px}
.chk input{width:auto}
.drop{border:1.5px dashed #3b5a70;border-radius:9px;padding:10px;text-align:center;color:var(--mut);cursor:pointer;font-size:12px}
.drop:hover{border-color:var(--acc);color:var(--txt)}
.hint{color:var(--mut);font-size:11px;line-height:1.6}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(460px,92vw)}
.bar{height:8px;border-radius:5px;background:#0d1a24;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{flex:1}
.tabs button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.el-list{display:flex;flex-direction:column;gap:4px}
.el-list .sitem{padding:4px 8px}
@media (max-width:1000px){.app{grid-template-columns:1fr;grid-template-rows:52px auto auto auto auto}.top{grid-column:1}.tl{grid-column:1;height:200px}.side,.props{max-height:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>محرر فيديو المنجزات</h1>
    <button id="bUndo" title="تراجع">↶ تراجع</button>
    <button id="bNew" class="ghost">مشروع جديد</button>
    <button id="bSaveProj">حفظ ملف المشروع</button>
    <button id="bLoadProj">فتح ملف مشروع</button>
    <button id="bExport" class="pri">تصدير الفيديو</button>
  </div>

  <div class="side" id="side"></div>

  <div class="stage">
    <div class="cwrap" id="cwrap"><canvas id="cv" width="1920" height="1080"></canvas></div>
    <div class="ctrl">
      <button id="bPlay" class="pri" style="min-width:90px">▶ تشغيل</button>
      <button id="bPrev">⏮</button><button id="bNext">⏭</button>
      <span class="time" id="tTime" dir="ltr">0:00 / 0:00</span>
      <label class="chk" style="margin:0"><input type="checkbox" id="cGuides" checked> إظهار حدود العناصر</label>
      <span style="flex:1"></span>
      <span class="hint">اسحب أي عنصر لتحريكه، والمربع في زاويته لتكبيره</span>
    </div>
  </div>

  <div class="props" id="props"></div>

  <div class="tl">
    <div class="tlbar">
      <b style="font-size:12px">الخط الزمني</b>
      <button id="bAddAudio">+ إضافة صوت / موسيقى</button>
      <button id="bSplitAudio">✂ قص الصوت عند المؤشر</button>
      <button id="bDelAudio" class="dan">حذف الصوت المحدد</button>
      <span style="flex:1"></span>
      <span class="hint">اسحب حافة الشريحة لتغيير مدتها • اسحب الصوت لنقله وحوافه لقصه</span>
      <label class="chk" style="margin:0">تكبير <input type="range" id="zoom" min="20" max="160" value="60" style="width:110px"></label>
    </div>
    <div class="tlscroll" id="tlscroll"><div class="tlinner" id="tlinner"></div></div>
  </div>
</div>

<div class="modal" id="mExport"><div class="box">
  <h3 style="margin:0 0 6px">تصدير الفيديو</h3>
  <div class="hint" id="exMsg">يتم تشغيل الفيديو وتسجيله بالوقت الحقيقي. اترك الصفحة مفتوحة حتى ينتهي.</div>
  <div class="bar"><i id="exBar"></i></div>
  <div class="row"><button id="exCancel">إلغاء</button><button id="exSave" class="pri" style="display:none">حفظ الملف</button></div>
</div></div>

<div class="modal" id="mConfirm"><div class="box">
  <div id="cfMsg" style="margin-bottom:12px"></div>
  <div class="row"><button id="cfNo">إلغاء</button><button id="cfYes" class="pri">تأكيد</button></div>
</div></div>

<input type="file" id="fileIn" style="display:none">

async function hydrate(a) {

    if (a.kind === "audio") {

    } else if (a.kind === "font") {

      await new Promise(r => { v.onloadeddata = r; v.onerror = r; setTimeout(r, 4000); });
      a.video = v; a.isVideo = true; a.duration = v.duration || 0;

      await dec.tracks.ready; const n = dec.tracks.selectedTrack.frameCount; a.frames = [];

  if (!a) return null;

  const ovEl = box.querySelector("#tOv");
  const setOv = async (f) => { if (!f) return; ovEl.innerHTML = "جاري تحميل الإطار… <br><small>ملفات GIF الطويلة تاخذ ثواني</small>"; const a = await addAsset(f, "overlay"); snapshot(); T.overlay = a.id; changed(true); renderProps(); };
  ovEl.onclick = async () => { const [f] = await pick("image/png,image/gif,image/webp,video/webm,video/*"); setOv(f); };
  ovEl.ondragover = e => e.preventDefault(); ovEl.ondrop = e => { e.preventDefault(); setOv(e.dataTransfer.files[0]); };
  const od = box.querySelector("#tOvDel"); if (od) od.onclick = () => { snapshot(); T.overlay = null; changed(true); renderProps(); };
}

/* ============================================================ timeline */
let PPS = 60; // pixels per second
let tlSel = null;
function renderTimeline() {
  const inner = $("#tlinner"); if (!S) return;
  const tm = timing(); const total = Math.max(tm.total, ...S.audio.map(a => a.start + a.len), 10);
  inner.innerHTML = ""; inner.style.width = (total * PPS + 200) + "px";
  const ruler = document.createElement("div"); ruler.className = "ruler";
  for (let s = 0; s <= total; s += (PPS < 40 ? 5 : 1)) { const m = document.createElement("span"); m.style.cssText = `position:absolute;left:${s * PPS}px;top:2px`; m.textContent = s % 5 === 0 ? fmtT(s) : "·"; ruler.appendChild(m); }
  ruler.onclick = ev => { const r = inner.getBoundingClientRect(); seek((ev.clientX - r.left) / PPS); };
  inner.appendChild(ruler);
  const tr = document.createElement("div"); tr.className = "track"; tr.style.top = "20px"; inner.appendChild(tr);
  tm.list.forEach(e => {
    const b = document.createElement("div"); b.className = "blk" + (e.s === selSlide ? " sel" : "");
    b.style.left = e.start * PPS + "px"; b.style.width = Math.max(8, e.s.dur * PPS - 2) + "px";
    b.textContent = slideLabel(e.s);
    const h = document.createElement("div"); h.className = "h r"; b.appendChild(h);
    b.onclick = ev => { if (ev.target === h) return; selectSlide(e.s); };
    h.onpointerdown = ev => {
      ev.stopPropagation(); snapshot(); const sx = ev.clientX, d0 = e.s.dur; h.setPointerCapture(ev.pointerId);
      h.onpointermove = mv => { e.s.dur = Math.max(1, Math.round((d0 + (mv.clientX - sx) / PPS) * 10) / 10); b.style.width = e.s.dur * PPS + "px"; };
      h.onpointerup = () => { h.onpointermove = null; changed(true); renderSide(); renderProps(); };
    };
    tr.appendChild(b);
  });
  // audio lanes
  const lanes = [];
  S.audio.forEach(cl => { if (cl.lane == null) cl.lane = 0; lanes[cl.lane] = true; });
  S.audio.forEach(cl => {
    const lane = document.createElement("div"); lane.className = "track"; lane.style.top = (66 + cl.lane * 46) + "px"; inner.appendChild(lane);
    const a = assets[cl.asset];
    const b = document.createElement("div"); b.className = "blk aud" + (tlSel === cl.id ? " sel" : "");
    b.style.left = cl.start * PPS + "px"; b.style.width = Math.max(10, cl.len * PPS) + "px";
    b.innerHTML = `<span>♪ ${a ? a.name : "صوت"}</span>`;
    const hl = document.createElement("div"); hl.className = "h l"; const hr = document.createElement("div"); hr.className = "h r"; b.appendChild(hl); b.appendChild(hr);
    if (a && a.buffer) { const wc = document.createElement("canvas"); wc.width = Math.max(10, Math.floor(cl.len * PPS)); wc.height = 36; drawWave(wc, a.buffer, cl.offset, cl.len); b.prepend(wc); }
    b.onpointerdown = ev => {
      tlSel = cl.id; renderAudioProps(cl); snapshot();
      const mode = ev.target === hl ? "l" : ev.target === hr ? "r" : "m"; const sx = ev.clientX, sy = ev.clientY, o = { ...cl };
      b.setPointerCapture(ev.pointerId);
      b.onpointermove = mv => {
        const dt = (mv.clientX - sx) / PPS; const dur = a && a.buffer ? a.buffer.duration : 1e9;
        if (mode === "m") { cl.start = Math.max(0, Math.round((o.start + dt) * 20) / 20); cl.lane = Math.max(0, Math.min(3, o.lane + Math.round((mv.clientY - sy) / 46))); }
        if (mode === "r") cl.len = clamp(o.len + dt, 0.2, dur - cl.offset);
        if (mode === "l") { const d = clamp(dt, -o.offset, o.len - 0.2); cl.start = Math.max(0, o.start + d); cl.offset = o.offset + d; cl.len = o.len - d; }
        b.style.left = cl.start * PPS + "px"; b.style.width = cl.len * PPS + "px"; lane.style.top = (66 + cl.lane * 46) + "px";
      };
      b.onpointerup = () => { b.onpointermove = null; changed(true); };
    };
    lane.appendChild(b);
  });
  const ph = document.createElement("div"); ph.className = "ph"; ph.id = "ph"; inner.appendChild(ph);
}
function drawWave(c, buf, off, len) {
  const x = c.getContext("2d"), d = buf.getChannelData(0), sr = buf.sampleRate; x.fillStyle = "#c9a6ff";
  for (let i = 0; i < c.width; i++) {
    const s0 = Math.floor((off + i / c.width * len) * sr), s1 = Math.floor((off + (i + 1) / c.width * len) * sr); let m = 0;
    for (let j = s0; j < s1; j += 64) m = Math.max(m, Math.abs(d[j] || 0));
    const h = m * c.height; x.fillRect(i, (c.height - h) / 2, 1, h);
  }
}
function updatePlayhead(t) {
  const ph = $("#ph"); if (!ph) return; ph.style.left = t * PPS + "px";
  if (playing) { const sc = $("#tlscroll"); const x = t * PPS; if (x < sc.scrollLeft || x > sc.scrollLeft + sc.clientWidth - 40) sc.scrollLeft = x - 60; }
}
function renderAudioProps(cl) {
  propTab = "audio"; const P = $("#props"); P.innerHTML = "";
  const a = assets[cl.asset];
  const box = document.createElement("div"); box.className = "grp";
  box.innerHTML = `<h3>♪ ${a ? a.name : ""}</h3>
    <div class="row"><div><label>يبدأ عند (ث)</label><input type="number" step="0.1" data-k="start"></div><div><label>المدة (ث)</label><input type="number" step="0.1" data-k="len"></div></div>
    <label>بداية القص من الملف (ث)</label><input type="number" step="0.1" data-k="offset">
    <label>مستوى الصوت</label><input type="range" min="0" max="1.5" step="0.05" data-k="vol">
    <div class="row"><div><label>تلاشي البداية (ث)</label><input type="number" step="0.1" min="0" data-k="fadeIn"></div><div><label>تلاشي النهاية (ث)</label><input type="number" step="0.1" min="0" data-k="fadeOut"></div></div>
    <button id="aFit" style="margin-top:8px;width:100%">مد الصوت لطول الفيديو كامل</button>
    <button id="aBack" style="margin-top:6px;width:100%">رجوع لإعدادات الشريحة</button>`;
  P.appendChild(box); bind(box, cl, () => renderTimeline());
  box.querySelector("#aFit").onclick = () => { snapshot(); const tot = timing().total; cl.start = 0; cl.len = Math.min(tot, (a && a.buffer ? a.buffer.duration : tot) - cl.offset); changed(true); renderAudioProps(cl); };
  box.querySelector("#aBack").onclick = () => { propTab = "slide"; tlSel = null; renderProps(); renderTimeline(); };
}
$("#bAddAudio").onclick = async () => {
  const files = await pick("audio/*,video/*", true);
  for (const f of files) {
    const a = await addAsset(f, "audio"); if (!a.buffer) continue;
    snapshot(); const lane = S.audio.length ? Math.min(3, Math.max(...S.audio.map(x => x.lane || 0)) + 1) : 0;
    const cl = { id: uid(), asset: a.id, start: S.audio.length ? T_NOW : 0, offset: 0, len: Math.min(a.buffer.duration, Math.max(5, timing().total)), vol: 0.8, lane: S.audio.length ? lane : 0, fadeIn: 0.5, fadeOut: 1.5 };
    S.audio.push(cl); tlSel = cl.id; changed(true); renderAudioProps(cl);
  }
};
$("#bSplitAudio").onclick = () => {
  const cl = S.audio.find(x => x.id === tlSel) || S.audio.find(x => T_NOW > x.start && T_NOW < x.start + x.len);
  if (!cl || !(T_NOW > cl.start && T_NOW < cl.start + cl.len)) return;
  snapshot(); const cut = T_NOW - cl.start;
  const c2 = { ...cl, id: uid(), start: T_NOW, offset: cl.offset + cut, len: cl.len - cut, fadeIn: 0 };
  cl.len = cut; cl.fadeOut = 0; S.audio.push(c2); tlSel = c2.id; changed(true);
};
$("#bDelAudio").onclick = () => { const i = S.audio.findIndex(x => x.id === tlSel); if (i < 0) return; snapshot(); S.audio.splice(i, 1); tlSel = null; changed(true); propTab = "slide"; renderProps(); };
$("#zoom").oninput = e => { PPS = Number(e.target.value); renderTimeline(); };

/* ============================================================ export */
let recorder = null, recChunks = [], recBlob = null, recExt = "webm";
async function startExport() {
  if (exporting) return;
  pause(); selEl = null;
  const ac = getAC(); await ac.resume();
  if (!recDest) { recDest = ac.createMediaStreamDestination(); master.connect(recDest); }
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  const cands = ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4;codecs=avc1,mp4a", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  const mime = cands.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mime) { $("#exMsg").textContent = "المتصفح هذا ما يدعم تسجيل الفيديو. جرّب Google Chrome على الكمبيوتر."; $("#mExport").classList.add("on"); return; }
  recExt = mime.startsWith("video/mp4") ? "mp4" : "webm";
  recChunks = []; recBlob = null;
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6, audioBitsPerSecond: 192e3 });
  recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => { recBlob = new Blob(recChunks, { type: mime }); $("#exMsg").textContent = "انتهى التسجيل ✔ (" + (recBlob.size / 1048576).toFixed(1) + " MB، صيغة " + recExt.toUpperCase() + ")"; $("#exSave").style.display = ""; };
  $("#exMsg").textContent = "يتم تشغيل الفيديو وتسجيله الآن بالوقت الحقيقي… اترك هذه الصفحة ظاهرة ولا تغيّر التبويب.";
  $("#exSave").style.display = "none"; $("#exBar").style.width = "0"; $("#mExport").classList.add("on");
  exporting = true; T_NOW = 0; recorder.start(500); setTimeout(play, 300);
}
function finishExport() { exporting = false; if (recorder && recorder.state !== "inactive") setTimeout(() => recorder.stop(), 400); }
$("#bExport").onclick = startExport;
$("#exCancel").onclick = () => { if (exporting) { exporting = false; pause(); try { recorder.stop(); } catch (e) {} recBlob = null; } $("#mExport").classList.remove("on"); };
$("#exSave").onclick = async () => {
  if (!recBlob) return;
  const dl = await getDownloads();
  if (!dl) { $("#exMsg").textContent = "الحفظ غير متاح في هذا العرض. افتح الصفحة من claude.ai وجرّب مرة ثانية."; return; }
  try { await dl.save({ filename: "فيديو_المنجزات." + recExt, data: recBlob }); $("#exMsg").textContent = "تم الحفظ ✔"; }
  catch (e) { $("#exMsg").textContent = e && e.code === "declined" ? "تم إلغاء الحفظ." : "تعذّر الحفظ: " + (e && (e.message || e.code)); }
};

const localDL = { save: async ({ filename, data }) => {
  const blob = data instanceof Blob ? data : new Blob([data]);
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000); return { status: "saved" };
} };
function getDownloads() {
  if (!downloadsP) { try { downloadsP = (window.claude && window.claude.use) ? window.claude.use("downloads").then(d => d || localDL).catch(() => localDL) : Promise.resolve(localDL); } catch (e) { downloadsP = Promise.resolve(localDL); } }
  return downloadsP;
}
/* ============================================================ project file */
function blobToB64(b) { return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); }
$("#bSaveProj").onclick = async () => {
  const dl = await getDownloads(); if (!dl) { alertMsg("الحفظ غير متاح في هذا العرض."); return; }
  const used = new Set(); S.slides.forEach(s => { if (s.media) used.add(s.media); s.els.forEach(e => e.asset && used.add(e.asset)); }); S.audio.forEach(a => used.add(a.asset)); if (S.theme.overlay) used.add(S.theme.overlay);
  Object.values(assets).filter(a => a.kind === "font").forEach(a => used.add(a.id));
  const list = [];
  for (const id of used) { const a = assets[id]; if (a) list.push({ id, kind: a.kind, name: a.name, type: a.type, fontName: a.fontName, data: await blobToB64(a.blob) }); }
  const json = JSON.stringify({ app: "nwc-video-editor", v: 1, proj: S, assets: list });
  try { await dl.save({ filename: "مشروع_الفيديو.json", data: new Blob([json], { type: "application/json" }) }); } catch (e) {}
};
$("#bLoadProj").onclick = async () => {
  const [f] = await pick(".json,application/json"); if (!f) return;
  try {
    const j = JSON.parse(await f.text()); if (!j.proj) throw 0;
    dbClear(); for (const k of Object.keys(assets)) delete assets[k];
    for (const a of j.assets || []) { const blob = await (await fetch(a.data)).blob(); const file = new File([blob], a.name, { type: a.type }); const x = await addAsset(file, a.kind, a.id); if (a.fontName) { x.fontName = a.fontName; } }
    S = j.proj; hist = [JSON.stringify(S)]; selSlide = playlist()[0]; T_NOW = 0; changed(true); renderAll();
  } catch (e) { alertMsg("الملف غير صالح."); }
};
$("#bNew").onclick = async () => {
  if (!(await confirmBox("بدء مشروع جديد؟ سيتم مسح المشروع الحالي من هذا المتصفح (احفظ ملف المشروع أولًا إذا تبغاه)."))) return;
  dbClear(); for (const k of Object.keys(assets)) delete assets[k];
  S = demoProject(); hist = [JSON.stringify(S)]; selSlide = playlist()[0]; T_NOW = 0; changed(true); renderAll();
};
function alertMsg(m) { $("#cfMsg").textContent = m; $("#mConfirm").classList.add("on"); $("#cfNo").style.display = "none"; $("#cfYes").onclick = () => { $("#mConfirm").classList.remove("on"); $("#cfNo").style.display = ""; }; }

/* ============================================================ controls */
$("#bPlay").onclick = () => playing ? pause() : play();
$("#bPrev").onclick = () => { const tm = timing(); const t = curTime(); const prev = [...tm.list].reverse().find(e => e.start < t - 0.3); seek(prev ? prev.start : 0); };
$("#bNext").onclick = () => { const tm = timing(); const t = curTime(); const nx = tm.list.find(e => e.start > t + 0.01); if (nx) seek(nx.start); };
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => e.preventDefault());

function renderAll() { renderSide(); renderProps(); renderTimeline(); }

/* ============================================================ boot */
let downloadsP = null;
(async function boot() {
  await dbOpen();
  const saved = await dbGet("kv", "proj");
  const as = await dbAll("assets");
  for (const a of as) { try { const file = new File([a.blob], a.name, { type: a.type }); const x = { id: a.id, kind: a.kind, name: a.name, type: a.type, blob: a.blob, fontName: a.fontName, url: URL.createObjectURL(a.blob) }; assets[a.id] = x; await hydrate(x); } catch (e) {} }
  try { S = saved ? JSON.parse(saved) : null; } catch (e) { S = null; }
  if (!S) S = demoProject();
  S.theme = Object.assign(defTheme(), S.theme || {});
  hist = [JSON.stringify(S)];
  selSlide = playlist()[0];
  try { await Promise.all(BASE_FONTS.map(f => document.fonts.load(`700 40px "${f}"`))); } catch (e) {}
  renderAll(); selectSlide(selSlide);
  requestAnimationFrame(loop);
  document.fonts.ready.then(() => {});
})();

</script>
